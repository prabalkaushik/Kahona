# "balanced" tier — better accuracy, still CPU-friendly.
# Use if fast.yaml's transcription accuracy feels too rough.

vad:
  model: silero_vad
  sample_rate: 16000
  frame_ms: 32
  threshold: 0.5
  silence_timeout_ms: 700
  min_speech_ms: 250

asr:
  backend: faster_whisper
  model_size: base.en          # ~140MB, noticeably better accuracy than tiny.en
  compute_type: int8
  beam_size: 2                   # slightly better decoding, still fast
  language: en

llm:
  backend: openai
  model: gpt-4o-mini
  max_tokens: 300
  temperature: 0.7
  stream: true
  system_prompt: >
    You are Kahona, a helpful, concise voice assistant. Keep responses short and
    conversational — you are being spoken aloud, not read as text. Avoid
    lists, markdown, or long explanations unless explicitly asked.

tts:
  backend: piper
  voice: en_US-lessac-medium
  voice_dir: models/piper
  sentence_chunking: true
  sample_rate: 22050

audio_io:
  input_device: null
  output_device: null
  channels: 1

logging:
  level: INFO
  log_latency_breakdown: true
